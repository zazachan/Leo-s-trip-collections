<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出國前 CHECK 名單</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Apple LiGothic Medium', 'Microsoft JhengHei', sans-serif;
            background-color: #eeeae6;
            color: #55504c;
            font-size: 16px;
            line-height: 1.7;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 16px;
        }
        @media (min-width: 600px) {
            body { font-size: 15px; }
            .container {
                margin: 30px auto;
                padding: 35px 40px;
                border-radius: 14px;
                box-shadow: 0 4px 20px rgba(85, 80, 76, 0.07);
            }
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 18px;
            text-decoration: none;
            color: #8c7b70;
            font-size: 14px;
            padding: 6px 14px;
            border: 1.5px solid #c2b8b2;
            border-radius: 20px;
            transition: background-color 0.18s ease;
        }
        .back-btn:hover { background-color: #f0ece8; }

        header {
            text-align: center;
            border-bottom: 2px solid #c2b8b2;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        header h1 { color: #8c7b70; margin: 0 0 8px 0; font-size: 24px; letter-spacing: 1px; }
        header p { margin: 0; color: #a3968e; font-size: 14px; }

        /* ── 燈號列（置頂固定） ── */
        .status-bar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
            background: #faf9f7;
            border: 1.5px solid #dbd5d0;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 22px;
            box-shadow: 0 2px 10px rgba(85, 80, 76, 0.08);
            transition: border-color 0.25s ease, background-color 0.25s ease;
        }
        .status-bar.done { border-color: #8fa89b; background: #f3f7f4; }
        .light {
            flex: 0 0 auto;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #c98f8a;
            box-shadow: 0 0 0 4px rgba(201, 143, 138, 0.22), inset 0 -3px 6px rgba(0, 0, 0, 0.12);
            transition: background-color 0.25s ease, box-shadow 0.25s ease;
        }
        .status-bar.done .light {
            background: #6fae88;
            box-shadow: 0 0 0 4px rgba(111, 174, 136, 0.28), 0 0 14px rgba(111, 174, 136, 0.55), inset 0 -3px 6px rgba(0, 0, 0, 0.12);
        }
        .status-text { flex: 1 1 auto; min-width: 0; }
        .status-title { font-weight: bold; color: #474340; font-size: 16px; line-height: 1.3; }
        .status-sub { font-size: 12px; color: #a3968e; }
        .reset-btn {
            flex: 0 0 auto;
            font: inherit;
            font-size: 14px;
            color: #8c7b70;
            background: #ffffff;
            border: 1.5px solid #c2b8b2;
            border-radius: 20px;
            padding: 6px 16px;
            cursor: pointer;
            transition: background-color 0.18s ease;
        }
        .reset-btn:hover { background: #f0ece8; }
        .reset-btn:active { background: #e8e2dd; }

        /* ── 分類區塊 ── */
        .group { margin-bottom: 22px; }
        .group-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin: 0 0 8px;
            font-size: 15px;
            color: #8c7b70;
            border-left: 5px solid var(--c);
            padding-left: 10px;
        }
        .group-count { font-size: 12px; color: #b5a9a2; font-weight: normal; }
        .g1 { --c: #c98f8a; }
        .g2 { --c: #8da6bd; }
        .g3 { --c: #c7a78f; }
        .g4 { --c: #8fa89b; }
        .g5 { --c: #a195b8; }

        .items { list-style: none; margin: 0; padding: 0; }
        .item label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            margin-bottom: 6px;
            background: #faf9f7;
            border: 1.5px solid #e8e2dd;
            border-radius: 10px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }
        .item label:hover { border-color: #c2b8b2; }
        .item input {
            flex: 0 0 auto;
            width: 22px;
            height: 22px;
            margin: 0;
            accent-color: #6fae88;
            cursor: pointer;
        }
        .item .txt { flex: 1 1 auto; transition: color 0.15s ease; }
        .item .note { font-size: 12px; color: #a3968e; margin-left: 6px; }
        .item.checked label { background: #f3f7f4; border-color: #cfdcd4; }
        .item.checked .txt { color: #a3968e; text-decoration: line-through; text-decoration-color: #c2b8b2; }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #b5a9a2;
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid #e8e2dd;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="../index.html" class="back-btn">← 返回首頁</a>
    <header>
        <h1>🧳 出國前 CHECK 名單</h1>
        <p>勾選紀錄只存在這台裝置，不會與其他人同步</p>
    </header>

    <div class="status-bar" id="status">
        <div class="light" id="light"></div>
        <div class="status-text">
            <div class="status-title" id="status-title">尚未完成</div>
            <div class="status-sub" id="status-sub"></div>
        </div>
        <button type="button" class="reset-btn" id="reset">重製</button>
    </div>

    <div id="lists"></div>

    <div class="footer">© Leo's Trip Collections</div>
</div>

<script>
    // 要增減項目只改這裡；勾選紀錄以「項目文字」當 key
    var GROUPS = [
        { cls: 'g1', title: '⭐ 最重要', items: [
            { t: '韓國入境填單' }
        ]},
        { cls: 'g2', title: '🧳 打包行李', items: [
            { t: '萬用插頭' }, { t: '牙刷牙膏' }, { t: '筆電＋充電器' }, { t: 'AR 眼鏡？' },
            { t: '浴巾' }, { t: '衣服 3 套' }, { t: '內衣褲' }, { t: '手機充電器' },
            { t: '杯套' }, { t: '手機掛繩' }, { t: '相機＋充電器' }
        ]},
        { cls: 'g3', title: '🛒 待買', items: [
            { t: '洗面乳？' }
        ]},
        { cls: 'g4', title: '✅ 出發前檢查', items: [
            { t: '手錶充電器' }, { t: '行動電源' }, { t: '手機' }, { t: '家裡鑰匙' },
            { t: '錢包' }, { t: '護照' }, { t: '耳機' }, { t: '卡套' }, { t: '刮鬍刀' }
        ]},
        { cls: 'g5', title: '🎒 隨身小物', items: [
            { t: '小雨傘' }, { t: '手錶' }, { t: '口罩' }
        ]}
    ];

    var KEY = 'leo-precheck-v1';

    function load() {
        try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
    }
    function save(state) {
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    var state = load();
    var boxes = [];
    var wrap = document.getElementById('lists');

    GROUPS.forEach(function (g) {
        var sec = document.createElement('section');
        sec.className = 'group ' + g.cls;
        var h = document.createElement('h2');
        h.className = 'group-title';
        var name = document.createElement('span');
        name.textContent = g.title;
        var cnt = document.createElement('span');
        cnt.className = 'group-count';
        h.appendChild(name); h.appendChild(cnt);
        sec.appendChild(h);

        var ul = document.createElement('ul');
        ul.className = 'items';
        g.items.forEach(function (it) {
            var li = document.createElement('li');
            li.className = 'item';
            var lb = document.createElement('label');
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = !!state[it.t];
            var tx = document.createElement('span');
            tx.className = 'txt';
            tx.textContent = it.t;
            if (it.n) {
                var nt = document.createElement('span');
                nt.className = 'note';
                nt.textContent = it.n;
                tx.appendChild(nt);
            }
            lb.appendChild(cb); lb.appendChild(tx);
            li.appendChild(lb);
            ul.appendChild(li);
            boxes.push({ cb: cb, li: li, key: it.t, group: sec, cnt: cnt });
            cb.addEventListener('change', function () {
                if (cb.checked) state[it.t] = 1; else delete state[it.t];
                save(state);
                render();
            });
        });
        sec.appendChild(ul);
        wrap.appendChild(sec);
    });

    function render() {
        var done = 0, perGroup = new Map();
        boxes.forEach(function (b) {
            b.li.classList.toggle('checked', b.cb.checked);
            if (b.cb.checked) done++;
            var p = perGroup.get(b.group) || { d: 0, t: 0, cnt: b.cnt };
            p.t++; if (b.cb.checked) p.d++;
            perGroup.set(b.group, p);
        });
        perGroup.forEach(function (p) { p.cnt.textContent = p.d + ' / ' + p.t; });
        var total = boxes.length, all = done === total;
        document.getElementById('status').classList.toggle('done', all);
        document.getElementById('status-title').textContent = all ? '全部完成，可以出發！' : '尚未完成';
        document.getElementById('status-sub').textContent = all ? done + ' / ' + total + ' 項已確認' : '還差 ' + (total - done) + ' 項（' + done + ' / ' + total + '）';
    }

    document.getElementById('reset').addEventListener('click', function () {
        if (Object.keys(state).length && !confirm('要取消所有勾選嗎？')) return;
        state = {};
        save(state);
        boxes.forEach(function (b) { b.cb.checked = false; });
        render();
    });

    render();
</script>

</body>
</html>
